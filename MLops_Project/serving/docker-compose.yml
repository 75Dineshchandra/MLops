services:
  readmission-api:
    build:
      context: ./serving
    image: readmission-api:local
    container_name: readmission-api
    ports:
      - "8000:8000"
    environment:
      MAX_RECORDS: "500"
      ID_FIELD: "encounter_id"
      LOG_PREDICTIONS: "true"
      # ADMIN_TOKEN: "change-me"        # if set, POST /reload needs the header X-Admin-Token
    volumes:
      - ./serving/bundle:/app/bundle:ro   # the exported champion (python serving/export_champion.py)
      - ./serving/logs:/app/logs          # prediction log, used later for drift and late-label checks
      - ./serving/ui:/app/ui:ro           # the console: edits show up after a browser refresh, no rebuild needed
    restart: unless-stopped