# Prometheus configuration (steps 11, 12 and 13).
global:
  scrape_interval: 15s        # keep at 15 s: replay weeks must last at least 20 s to show up
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml          # real-traffic rules (long windows)
  - /etc/prometheus/alerts_replay.yml   # replay and drill rules (3-minute windows)
  - /etc/prometheus/alerts_drift.yml    # input and score drift rules (PSI from the drift exporter)

scrape_configs:
  - job_name: readmission-api
    metrics_path: /metrics
    static_configs:
      - targets: ["readmission-api:8000"]   # the compose service name; resolves inside the compose network

  - job_name: drift-exporter                # step 13: PSI of every input feature and of the scores
    metrics_path: /metrics
    static_configs:
      - targets: ["drift-exporter:9100"]

  - job_name: prometheus                    # Prometheus watching itself (handy to see it is alive)
    static_configs:
      - targets: ["localhost:9090"]
